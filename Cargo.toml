[package]
name = "logitech-dpi"
version = "0.1.0"
edition = "2021"

[dependencies]
# glow (OpenGL) backend only, Wayland + X11, no accesskit/persistence.
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
# Pure-Rust hidraw backend; no libhidapi / libudev-dev needed.
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
